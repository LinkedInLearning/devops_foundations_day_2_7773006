name: Apply
description: Run 'terragrunt apply' on the existing checkout and add a comment to the PR with the result.

inputs:
  tg_dir:
    description: Terragrunt directory to run the apply in.
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials for apply (OIDC)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: us-east-2
        # TODO: fill in your own IAM role ARN!
        role-to-assume: REPLACE_ME

    - name: Read the app ref
      if: github.event_name == 'workflow_run'
      id: app_ref
      shell: bash
      working-directory: ${{ inputs.tg_dir }}
      run: |
        set -euo pipefail

        ami_ref=$(jq -er '.ami_ref' terraform.tfvars.json)
        echo "sha=$ami_ref" >> "$GITHUB_OUTPUT"

    - name: Find the PR
      uses: jwalton/gh-find-current-pr@v1
      id: find_pr
      with:
        state: all
        sha: ${{ steps.app_ref.outputs.sha || github.sha }}

    # Uses mise.toml for versions
    - name: Run apply
      id: apply
      uses: gruntwork-io/terragrunt-action@v3
      with:
        tg_dir: ${{ inputs.tg_dir }}
        tg_command: apply -lock-timeout=60m -no-color -input=false
        tg_add_approve: 1
        tg_comment: ${{ steps.find_pr.outputs.number != '' && '1' || '0' }}
        tg_comment_url: ${{ case(steps.find_pr.outputs.number == '', '', format('{0}/repos/{1}/issues/{2}/comments', github.api_url, github.repository, steps.find_pr.outputs.number)) }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
