name: Plan
description: Run 'terragrunt plan' on the existing checkout and add a comment to the PR with the results.

inputs:
  tg_dir:
    description: Terragrunt directory to run plan in.
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials for plan (OIDC)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: us-east-2
        # TODO: fill in your own IAM role ARN!
        role-to-assume: REPLACE_ME

    # Uses mise.toml for versions
    - name: Run plan
      id: plan
      uses: gruntwork-io/terragrunt-action@v3
      with:
        tg_dir: ${{ inputs.tg_dir }}
        tg_command: plan -no-color -input=false
        tg_comment: 1
      env:
        GITHUB_TOKEN: ${{ github.token }}
