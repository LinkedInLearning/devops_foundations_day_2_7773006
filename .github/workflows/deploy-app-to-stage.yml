name: Deploy App to Stage

on:
  workflow_run:
    workflows: ["Test App"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Build the same commit that passed Test App, even if main has advanced.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-2
          # TODO: fill in your own IAM role here
          role-to-assume: "arn:aws:iam::168852252849:role/github-actions-packer-build"

      - name: Build AMI and update app ref in stage tfvars file
        working-directory: app
        run: |
          set -eo pipefail

          ami_ref=$(git rev-parse HEAD)
          npm run build

          # Commit the AMI update on main rather than the detached build commit.
          git fetch origin main
          git checkout -B main origin/main

          ./update-tfvars-json.sh "../tofu/live/stage/terraform.tfvars.json" "ami_ref" "$ami_ref" "chore: deploy app ref $ami_ref to stage"
