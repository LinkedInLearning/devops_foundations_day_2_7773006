name: Test App

on:
  push:
    branches:
      - "main"
      # TODO: undo this change! The extra branch is just here for testing.
      - chapter-05/lab-07
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        working-directory: app
        run: |
          npm install
          npm test