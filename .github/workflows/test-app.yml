name: Test App

on:
  push:
    branches:
      - "main"
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        working-directory: app
        run: |
          npm install
          npm test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-app-to-stage.yml
