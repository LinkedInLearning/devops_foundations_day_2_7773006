name: Test App

on:
  push:
    branches:
      - "main"
      # TODO: undo this change! The extra branch is just here for testing.
      - chapter-05/lab-07
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        working-directory: app
        run: |
          npm install
          npm test

  deploy:
    # TODO: undo this change! Re-enable the if-check; disabled for now just for testing the chapter-05/lab-07 branch.
    # if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy app to stage
        uses: ./.github/workflows/deploy-app-to-stage.yml