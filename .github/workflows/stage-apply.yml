name: Terragrunt Apply Stage

on:
  push:
    branches:
      - main
    paths:
      - 'tofu/live/stage/**'
  workflow_call:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply staging
        uses: ./.github/actions/apply
        with:
          tg_dir: tofu/live/stage
