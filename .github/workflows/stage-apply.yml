name: Terragrunt Apply Stage

on:
  push:
    branches:
      - main
      # TODO: remove, this is just for testing
      - chapter-05/lab-06
    paths:
      - 'tofu/live/stage/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  apply:
    uses: ./.github/workflows/apply.yml
    with:
      tg_dir: tofu/live/stage
      # TODO: fill in your own IAM role ARN!
      role_to_assume: arn:aws:iam::168852252849:role/github-actions-apply
