name: Terragrunt Plan Reusable

on:
  workflow_call:
    inputs:
      tg_dir:
        description: Terragrunt directory to run the plan in.
        required: true
        type: string
      role_to_assume:
        description: IAM role to assume before running Terragrunt.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan-on-pr:
    name: Terragrunt Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials for plan (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-2
          role-to-assume: ${{ inputs.role_to_assume }}

      # Uses mise.toml for versions
      - name: Run plan
        id: plan
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: ${{ inputs.tg_dir }}
          tg_command: plan -no-color -input=false
          tg_comment: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
