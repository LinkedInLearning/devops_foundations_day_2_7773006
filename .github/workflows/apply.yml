name: Terragrunt Apply Reusable

on:
  workflow_call:
    inputs:
      tg_dir:
        description: Terragrunt directory to run the apply in.
        required: true
        type: string
      role_to_assume:
        description: IAM role to assume before running Terragrunt.
        required: true
        type: string

jobs:
  apply-on-main:
    name: Terragrunt Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials for apply (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-2
          role-to-assume: ${{ inputs.role_to_assume }}

      - uses: jwalton/gh-find-current-pr@v1
        id: find_pr
        with:
          state: all

      # Uses mise.toml for versions
      - name: Run apply
        id: apply
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: ${{ inputs.tg_dir }}
          tg_command: apply -lock-timeout=60m -no-color -input=false
          tg_add_approve: 1
          tg_comment: 1
          tg_comment_url: ${{ case(steps.find_pr.outputs.number == '', '', format('https://api.github.com/repos/{0}/issues/{1}/comments', github.repository, steps.find_pr.outputs.number)) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
