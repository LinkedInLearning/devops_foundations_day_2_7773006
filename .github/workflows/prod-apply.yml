name: Terragrunt Apply Prod

on:
  push:
    branches:
      - main
    paths:
      - 'tofu/live/prod/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply production
        uses: ./.github/actions/apply
        with:
          tg_dir: tofu/live/prod
