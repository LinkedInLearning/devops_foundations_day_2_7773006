name: Terragrunt Apply Prod

on:
  push:
    branches:
      - main
    paths:
      - 'tofu/live/prod/**'
  workflow_run:
    workflows: ["Promote App to Prod"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply production
        uses: ./.github/actions/apply
        with:
          tg_dir: tofu/live/prod
