name: Terragrunt Plan Prod

on:
  pull_request:
    paths:
      - 'tofu/live/prod/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    uses: ./.github/workflows/plan.yml
    with:
      tg_dir: tofu/live/prod
      # TODO: fill in your own IAM role ARN!
      role_to_assume: arn:aws:iam::168852252849:role/github-actions-plan
