name: Terragrunt Plan Stage

on:
  pull_request:
    paths:
      - 'tofu/live/stage/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Plan staging
        uses: ./.github/actions/plan
        with:
          tg_dir: tofu/live/stage
